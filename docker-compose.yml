services:
  postgres:
    image: postgres:15-alpine
    container_name: olist_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-olist_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olist_secret_pw}
      POSTGRES_DB: ${POSTGRES_DB:-olist_ecommerce}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-olist_user} -d ${POSTGRES_DB:-olist_ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: